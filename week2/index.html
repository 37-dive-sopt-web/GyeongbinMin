<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>웹계인 관리 페이지</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <div class="header-left">👽</div>
    <h1 class="header-title">웹계인 관리 페이지</h1>
    <div class="header-right">웹 파트 37기 YB 민경빈</div>
  </header>

  <main>
  <section class="filter-container">
  <h3 class="filter-title">검색 필터</h3>
    <form class="filter-form">
      <div class="filter-row">
        <div class="form-group">
          <label for="name">이름</label>
          <input type="text" id="name" placeholder="이름을 입력하세요" />
        </div>
      </div>
      <div class="filter-row">
        <div class="form-group">
          <label for="ename">영문 이름</label>
          <input type="text" id="ename" placeholder="영문 이름을 입력하세요" />
        </div>
      </div>
      <div class="filter-row grid">
        <div class="form-group">
          <label for="github">깃허브</label>
          <input type="text" id="github" placeholder="깃허브 아이디를 입력하세요" />
        </div>
  
        <div class="form-group">
          <label for="gender">성별</label>
          <select id="gender">
            <option value="..">전체</option>
            <option value="male">남자</option>
            <option value="female">여자</option>
          </select>
        </div>
  
        <div class="form-group">
          <label for="role">역할</label>
          <select id="role">
            <option value="..">전체</option>
            <option value="YB">YB</option>
            <option value="OB">OB</option>
          </select>
        </div>
      </div>
  
      
      <div class="filter-row grid">
        <div class="form-group">
          <label for="group">금잔디조</label>
          <input type="number" id="group" placeholder="금잔디조를 입력하세요 (1~9)" />
        </div>
  
        <div class="form-group">
          <label for="age">나이</label>
          <input type="number" id="age" placeholder="나이를 입력하세요" />
        </div>
      </div>
  
 
      <div class="form-buttons">
        <button type="submit" class="apply-btn">적용</button>
        <button type="reset" class="reset-btn">초기화</button>
      </div>
    </form>
  </section>

    <!-- 테이블 영역 -->
  <section class="table-container">
    <div class="table-header">
      <h2>37기 웹 파트 목록</h2>
      <div class="table-actions">
        <button class="delete-btn">선택 삭제</button>
        <button class="add-btn" id="openModalBtn">추가</button> 
      </div>
    </div>

    <table id="memberTable">
      <thead>
        <tr>
          <th><input type="checkbox" id="selectAll"></th>
          <th>이름</th>
          <th>영문 이름</th>
          <th>깃허브</th>
          <th>성별</th>
          <th>역할</th>
          <th>금잔디조</th>
          <th>나이</th>
        </tr>
      </thead>
      <tbody>
        <!-- 랜더링 되는 부분  -->
      </tbody>
    </table>
  </section>
</main>


  <div id="addModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>멤버 추가</h3>
        <button type="button" class="close-modal">&times;</button>
      </div>

      <form id="addForm" class="modal-form">
        <div class="form-grid">
          <label>이름
            <input type="text" id="addName" placeholder="이름을 입력하세요" required>
          </label>
          <label>영문 이름
            <input type="text" id="addEname" placeholder="영문 이름을 입력하세요" required>
          </label>
          <label>깃허브
            <input type="text" id="addGithub" placeholder="깃허브 아이디를 입력하세요" required>
          </label>
          <label>성별
            <select id="addGender" required>
              <option value="">선택</option>
              <option value="남자">남자</option>
              <option value="여자">여자</option>
            </select>
          </label>
          <label>역할
            <select id="addRole" required>
              <option value="">선택</option>
              <option value="YB">YB</option>
              <option value="OB">OB</option>
            </select>
          </label>
          <label>금잔디조
            <input type="number" id="addGroup" placeholder="금잔디조를 입력하세요 (1~9)" min="1" max="9" required>
          </label>
          <label>나이
            <input type="number" id="addAge" placeholder="나이를 입력하세요" required>
          </label>
        </div>
        <div class="modal-footer">
          <button type="submit" class="add-btn-modal">추가</button>
        </div>
      </form>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
